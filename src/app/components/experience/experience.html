<section id="experience" class="experience-section">
  <div class="section-heading">
    <span class="eyebrow">Experiencia</span>
    <h2>Trayectoria profesional</h2>
  </div>

  <div class="experience-grid">
    <article class="experience-card" *ngFor="let exp of experiences()">
      <div class="experience-header">
        <span class="experience-date">{{ exp.date }}</span>
        <span class="experience-badge">{{ exp.location }}</span>
      </div>

      <h3>{{ exp.role }}</h3>
      <h4>{{ exp.company }}</h4>

      <ul>
        <li *ngFor="let desc of exp.description">{{ desc }}</li>
      </ul>

      <div class="tech-stack">
        <span *ngFor="let tech of exp.technologies">{{ tech }}</span>
      </div>
    </article>
  </div>
</section>
